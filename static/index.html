<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Reminder</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🔔</span>
                <h1>Smart Reminder</h1>
            </div>
            <div class="status" id="connection-status">Online</div>
        </header>

        <main class="chat-container" id="chat-window">
            <div class="message ai-message">
                <div class="bubble">
                    Hello! I'm your AI assistant. Tell me about your project or task with dates, and I'll handle the scheduling for you.
                </div>
            </div>
        </main>

        <footer class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="e.g., I have an Optimization project from 31-03 to 30-04..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </footer>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
